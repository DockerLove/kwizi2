services:
  postgres:
    image: postgres:15
    container_name: kwizi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 50432
      POSTGRES_DB: monolit_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monolit_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: wurstmeister/zookeeper
    container_name: kwizi-zookeeper
    restart: unless-stopped

  kafka:
    image: wurstmeister/kafka
    container_name: kwizi-kafka
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "private-messages:3:1,private-messages-dlq:3:1,group-messages:3:1,group-messages-dlq:3:1"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      - zookeeper
    restart: unless-stopped

  app:
    image: dockertsv/kwizi-app:latest
    container_name: kwizi-app
    restart: unless-stopped
    ports:
      - "8250:8250"
    volumes:
      - uploads_volume:/app/uploads
      - logs_volume:/app/logs
    environment:
      spring.datasource.url: jdbc:postgresql://postgres:5432/monolit_db
      spring.datasource.username: postgres
      spring.datasource.password: 50432
      spring.kafka.bootstrap-servers: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_volume:
  logs_volume: