# ===== Kafka (???????? ?????????) =====

spring.kafka.auto-startup=true

# ===== Producer =====
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.linger.ms=0
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432

# ===== Consumer =====
spring.kafka.listener.group-messages.group-id=websocket-group
spring.kafka.listener.group-messages.concurrency=3

# ????????? DLQ
spring.kafka.listener.dlq.group-messages-dlq.topic=group-messages-dlq
spring.kafka.listener.dlq.group-messages-dlq.enabled=true

# ????????? ???????????
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.transaction-timeout-ms=60000
spring.kafka.admin.properties.request.timeout.ms=50000
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.fetch-max-wait=500
spring.kafka.consumer.fetch-min-size=1

# ===== Retry & DLQ =====
spring.kafka.listener.ack-mode=RECORD
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.listener.type=single

# ????????? ????????? ??????? (3 ??????? ? ?????????? 1 ???)
spring.kafka.listener.default-error-handler.enabled=true
spring.kafka.retry.topic.attempts=3
spring.kafka.retry.topic.initial-interval=1000
spring.kafka.retry.topic.multiplier=1.0
spring.kafka.retry.topic.max-interval=1000

# Dead Letter Queue (DLQ)
spring.kafka.listener.dlq-producer-property.delivery.timeout.ms=30000

# ===== ???? Kafka (??????????? ??????) =====
logging.level.org.apache.kafka=WARN
logging.level.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=ERROR
logging.level.org.apache.kafka.common.metrics=ERROR
logging.level.org.apache.kafka.common.utils=ERROR
logging.level.org.apache.kafka.common.utils.AppInfoParser=ERROR
logging.level.org.apache.kafka.clients.consumer.internals=ERROR

