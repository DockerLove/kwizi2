<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Tester</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        #output { margin-top: 20px; border: 1px solid #ccc; padding: 10px; }
    </style>
</head>
<body>
<h2>WebSocket Tester</h2>

<div>
    <label>User ID: <input type="number" id="userId" value="2"></label><br>
    <label>Recipient ID: <input type="number" id="recipientId" value="3"></label><br>
    <label>Message: <input type="text" id="message" value="Test message"></label><br>
    <button onclick="connect()">Connect</button>
    <button onclick="sendMessage()">Send</button>
</div>

<div id="output"></div>

<script>
    let socket;
    const output = document.getElementById('output');

    function connect() {
        const userId = document.getElementById('userId').value;
        socket = new WebSocket(`ws://localhost:8080/ws?id=${userId}`);

        socket.onopen = () => addMessage('CONNECTED');
        socket.onmessage = (e) => addMessage(`RECEIVED: ${e.data}`);
        socket.onerror = (e) => addMessage(`ERROR: ${e.message}`);
        socket.onclose = () => addMessage('DISCONNECTED');
    }

    function sendMessage() {
        const msg = {
            type: "PRIVATE",
            recipientId: parseInt(document.getElementById('recipientId').value),
            text: document.getElementById('message').value
        };
        socket.send(JSON.stringify(msg));
        addMessage(`SENT: ${JSON.stringify(msg)}`);
    }

    function addMessage(text) {
        output.innerHTML += `<p>${new Date().toLocaleTimeString()}: ${text}</p>`;
    }
</script>
</body>
</html>
