name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 50432
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      zookeeper:
        image: wurstmeister/zookeeper
        ports:
          - 2181:2181
      
      kafka:
        image: wurstmeister/kafka
        env:
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ZOOKEEPER_CONNECT: localhost:2181
          KAFKA_CREATE_TOPICS: "test-topic:1:1,private-messages:1:1,group-messages:1:1"
          KAFKA_NUM_PARTITIONS: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('kwizi/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
    
    - name: Wait for services to be ready
      run: |
        echo "⏳ Waiting for PostgreSQL..."
        timeout 60 bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'
        echo "✅ PostgreSQL is ready!"
        
        echo "⏳ Waiting for Kafka..."
        # Ждем пока Kafka запустится (нужно больше времени)
        sleep 30
        timeout 90 bash -c 'until nc -z localhost 9092; do sleep 5; done'
        echo "✅ Kafka port is open"
        
        # Даем Kafka время на инициализацию
        sleep 20
        echo "✅ All services are ready"
    
    - name: Build with Maven
      run: |
        cd kwizi
        chmod +x mvnw
        ./mvnw clean compile -DskipTests
      env:
        SPRING_PROFILES_ACTIVE: test
    
    - name: Run ALL tests
      run: |
        cd kwizi
        ./mvnw test -Dtest="!*Integration*"
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: 50432
        SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
        # Добавьте другие переменные если нужно
        FILE_STORAGE_CHAT_AVATAR_PATH: ./test-uploads/chat/
        FILE_STORAGE_USER_AVATAR_PATH: ./test-uploads/user/
        LOGGING_FILE_NAME: ./test-logs/application.log
    
    - name: Print test results
      run: |
        echo "🎉 Тесты завершены!"
        echo "Если видите это сообщение - все тесты прошли успешно!"