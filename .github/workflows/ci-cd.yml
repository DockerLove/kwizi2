name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Verify project structure
      run: |
        echo "📁 Project structure:"
        ls -la
        echo "📁 kwizi folder:"
        ls -la kwizi/
    
    - name: Build with Maven
      run: |
        cd kwizi
        chmod +x mvnw
        ./mvnw clean compile -DskipTests
    
    - name: Print success
      run: echo "✅ CI успешно запустился! Проект готов к сборке."