jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 50432
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      zookeeper:
        image: wurstmeister/zookeeper
        ports:
          - 2181:2181
      
      kafka:
        image: wurstmeister/kafka
        env:
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_ZOOKEEPER_CONNECT: localhost:2181
          KAFKA_CREATE_TOPICS: "test-topic:1:1,private-messages:1:1,group-messages:1:1"
          KAFKA_NUM_PARTITIONS: 1
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
        depends_on:
          - zookeeper
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Install kafkacat for Kafka testing
      run: |
        sudo apt-get update
        sudo apt-get install -y kafkacat
    
    - name: Wait for services to be ready
      run: |
        echo "Waiting for PostgreSQL..."
        timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'
        echo "PostgreSQL is ready!"
        
        echo "Waiting for Kafka..."
        sleep 45  # даем больше времени для Kafka
        
        # Проверяем Kafka
        timeout 30 bash -c 'until nc -z localhost 9092; do sleep 2; done'
        echo "Kafka port is open!"
        
        # Даем Kafka время на инициализацию
        sleep 15
    
    - name: Build with Maven
      run: |
        cd kwizi
        chmod +x mvnw
        ./mvnw clean compile -DskipTests
    
    - name: Run tests (без интеграционных)
      run: |
        cd kwizi
        ./mvnw test -Dtest="!*Integration*" -Dspring.kafka.bootstrap-servers=localhost:9092
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: 50432
        SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092