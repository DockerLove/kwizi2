name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 50432
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Wait for PostgreSQL
      run: |
        echo "Waiting for PostgreSQL..."
        sleep 15
        timeout 30 bash -c 'until pg_isready -h localhost -p 5432; do sleep 2; done'
        echo "PostgreSQL ready"
    
    - name: Run ALL tests
      run: |
        cd kwizi
        chmod +x mvnw
        # Запускаем ВСЕ тесты что есть
        ./mvnw test -Dspring.kafka.bootstrap-servers=
      env:
        SPRING_PROFILES_ACTIVE: test
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/test_db
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: 50432
    
    - name: Result
      run: |
        if [ $? -eq 0 ]; then
          echo "✅ Все тесты прошли успешно!"
        else
          echo "❌ Некоторые тесты не прошли"
          exit 1
        fi